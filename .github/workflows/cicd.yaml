name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v2
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build backend with Maven
        run: ./mvnw clean package

      - name: Build Docker image
        run: |
          echo "${{ vars.ENV_FILE }}" > .env
          #ls -la
          #cat .env
          docker build -t netflix-backend:latest .

      - name: Docker push
        run: |
          docker tag netflix-backend:latest 174000857392.dkr.ecr.eu-north-1.amazonaws.com/netflix-backend: ${GITHUB_RUN_NUMBER}
          docker push 174000857392.dkr.ecr.eu-north-1.amazonaws.com/netflix-backend: ${GITHUB_RUN_NUMBER}
   

 
 